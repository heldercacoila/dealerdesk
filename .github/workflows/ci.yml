name: CI Pipeline

on:
  push:
    branches:
      - master
      - 'TICKET-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Linux / GCC
      - name: Build Application (Linux)
        if: runner.os == 'Linux'
        run: |
          make clean
          make

      - name: Run Test Suite (Linux)
        if: runner.os == 'Linux'
        run: make test

      - name: Upload Binary Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dealerdesk-linux-x64
          path: dealerdesk

      # Windows / MSVC
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Application (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\build.ps1 -Clean
          .\build.ps1

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\build.ps1 -Test

      - name: Upload Binary Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dealerdesk-windows-x64
          path: dealerdesk.exe

  release:
    name: Publish Release
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version Tag
        id: semver
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag found: '$LATEST_TAG'"
          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v2.4.0"
            MAJOR=2
            MINOR=4
            PATCH=0
          else
            VERSION_NUM="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
            MAJOR=${MAJOR:-2}
            MINOR=${MINOR:-4}
            PATCH=${PATCH:-0}
            COMMITS=$(git log "$LATEST_TAG..HEAD" --oneline)
            if echo "$COMMITS" | grep -Eq '^[a-f0-9]+ feat(\(.*\))?:'; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Ensure tag does not already exist
          while git rev-parse "$NEXT_TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$NEXT_TAG" | grep -q "$NEXT_TAG"; do
            PATCH=$((PATCH + 1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "Calculated tag: $NEXT_TAG"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        env:
          NEW_TAG: ${{ steps.semver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: dealerdesk-linux-x64
          path: release-artifacts/linux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: dealerdesk-windows-x64
          path: release-artifacts/windows

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          cp release-artifacts/linux/dealerdesk dist/dealerdesk-linux-x64
          chmod +x dist/dealerdesk-linux-x64
          cp release-artifacts/windows/dealerdesk.exe dist/dealerdesk-windows-x64.exe

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.semver.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            dist/dealerdesk-linux-x64 \
            dist/dealerdesk-windows-x64.exe \
            --title "DealerDesk $TAG_NAME" \
            --generate-notes
